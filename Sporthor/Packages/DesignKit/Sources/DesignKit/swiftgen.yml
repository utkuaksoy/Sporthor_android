# SwiftGen configuration file

strings:
  inputs:
    - Resources/Strings/tr.lproj
  outputs:
    - templatePath: Templates/localization.stencil
      output: Resources/Gen/Strings.swift
      params:
        publicAccess: true

colors:
  inputs:
    - Resources/Color/Colors.json
  outputs:
    - templatePath: Templates/colors.stencil
      output: ./Resources/Gen/Assets.swift
      params:
        publicAccess: true
      
fonts:
  inputs:
    - Resources/Fonts
  outputs:
      templateName: swift5
      output: Resources/Gen/Fonts.swift
      params:
          bundle: Bundle.module
          publicAccess: true
          fontAliasName: _Font
      header:
        // swiftlint:disable all
        @unchecked Sendable
      
